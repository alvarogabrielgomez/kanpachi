# kanpachi-invite: la página de invitación.
#
# HTML estático servido por nginx, atado al loopback. Solo el proxy inverso
# llega, igual que Vaultwarden. Nada de esto escucha en público por su cuenta.
#
# Deliberadamente NO comparte la red de kanpachi-seed: son cosas distintas,
# una sirve un archivo y la otra presenta peers, y no tienen por qué verse.
services:
  kanpachi-invite:
    image: nginx:1.27-alpine
    container_name: kanpachi-invite
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Usa la red bridge que ya existe en vez de crear una nueva. Crear una red
    # reescribe reglas de iptables, y en este droplet ya conviven once redes
    # con CrowdSec y npmplus tocando las suyas. Sirviendo un archivo estático
    # no hace falta descubrir a nadie, así que la red propia no aporta nada y
    # sí agrega riesgo.
    network_mode: bridge
    ports:
      # Loopback a propósito. Apunta tu nginx acá.
      - "127.0.0.1:8010:80"
    mem_limit: 64m
    cpu_period: 100000
    cpu_quota: 25000
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
