# Servidor provisional de la página de invitación.
#
# El destino es que la sirva kanpachi-registry, el binario Go del seed, en el
# mismo puerto que /api (decisión 24). Mientras ese binario no exista, este
# nginx sirve el HTML solo, y la página degrada a la tarjeta genérica sin
# contador porque /api responde 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Sin listado de directorios y sin delatar la versión de nginx.
    autoindex off;
    server_tokens off;

    # Los logs pasan a contener invite IDs, porque desde la decisión 17 el ID
    # viaja en la ruta. Es un cambio real respecto del diseño anterior y está
    # aceptado con su argumento: un invite ID no es material criptográfico, y
    # quien lo lea obtiene la tarjeta y el derecho a tocar la puerta, jamás el
    # secreto de la red real. Retención corta, por eso la rotación de abajo.
    access_log /var/log/nginx/access.log;

    # CSP estricta. La página es autocontenida, así que puede prohibirlo todo
    # salvo lo suyo. Los inline hacen falta porque el CSS y el JS viven dentro
    # del HTML, que es lo que la vuelve servible desde cualquier sitio sin
    # dependencias. Los logos van en línea como SVG, así que no hace falta
    # abrir img-src.
    #
    # connect-src 'self' y no 'none': la decisión 24 autoriza exactamente una
    # petición, al registro de salas del mismo origen. Dejarlo en 'self' es lo
    # que impide que una inyección que se nos escapara mande nada a un tercero.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Mientras no exista el registro, /api responde 404 y no cae al HTML. Sin
    # esto, la página recibiría el propio HTML como respuesta y lo intentaría
    # parsear como JSON, o sea un error confuso en la consola en vez de un
    # camino previsto.
    location /api/ {
        return 404;
    }

    # Cualquier otra ruta sirve la misma página. El invite ID va en la ruta y
    # lo resuelve el JavaScript, así que no hay rutas dinámicas que declarar.
    location / {
        try_files $uri /index.html;
    }
}
