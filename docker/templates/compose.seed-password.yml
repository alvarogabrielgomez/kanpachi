# Kanpachi against a registry that asks for a password to host on it.
#
# Entering a room never asks for one; hosting on somebody else's registry can.
#
# The password goes in on stdin and never on a command line, because
# /proc/<pid>/cmdline is readable by anybody on the machine. Two ways to hand it
# over, and the file is the better one.

services:
  kanpachi:
    image: ghcr.io/alvarogabrielgomez/kanpachi:latest
    container_name: kanpachi
    restart: always

    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]

    volumes:
      - kanpachi-data:/var/lib/kanpachi

    # Kanpachi shares this machine's network. On Docker Desktop that machine
    # is the Linux VM, not your desktop. For the game in the same compose,
    # see compose.sidecar.yml.
    network_mode: host

    init: true
    stop_grace_period: 60s

    # Compose mounts this at /run/secrets/seed_password inside the container.
    secrets:
      - seed_password

    environment:
      KANPACHI_SEED: kanpachi.accentio.dev
      KANPACHI_ROOM_NAME: "Zomboid nights"
      KANPACHI_GAME: project-zomboid

      # Preferred: point at a file, and the password never enters the
      # environment. This is the _FILE convention the Postgres and MySQL images
      # use, and it works with any mounted file, not just a compose secret.
      KANPACHI_SEED_PASSWORD_FILE: /run/secrets/seed_password

      # The other way, when a file is more trouble than it is worth. It is
      # simpler and it is worse: the environment shows up whole in
      # `docker inspect` and in /proc/<pid>/environ.
      # KANPACHI_SEED_PASSWORD: "..."

secrets:
  seed_password:
    file: ./seed-password.txt

volumes:
  kanpachi-data:
