name: kanpachi_ui
description: "Kanpachi: LAN virtual privada para jugar entre amigos. Cliente de escritorio."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  # Cubit por feature, según el house style de Accentio.
  flutter_bloc: ^9.1.1
  # Contenedor detrás del Injector propio. Nada lo resuelve directo.
  get_it: ^8.0.3
  # La anotación viaja en el source, así que va en dependencies; el generador no.
  theme_tailor_annotation: ^3.0.2
  # Un solo SVG monocromo teñido desde los tokens. Dos archivos de color
  # distinto serían dos verdades que el tema no controla.
  flutter_svg: ^2.0.17
  window_manager: ^0.5.2
  # La bandeja no es una pantalla de la app: es el menú del icono en la
  # bandeja de Windows. Cerrar la ventana esconde la ventana, y ese icono es
  # lo único que queda para volver.
  tray_manager: ^0.5.2
  # El named pipe del daemon, por FFI. `dart:io` no habla named pipes de
  # Windows y el atajo de abrirlo como archivo está roto desde Flutter 3.27,
  # así que la única vía es kernel32.
  #
  # Version FIJA y sin acento circunflejo: esto es la puerta de un daemon que
  # corre como SYSTEM, y una actualización que entre sola no es una decisión de
  # nadie. Subirla es un commit a propósito.
  ffi: 2.1.4
  win32: 6.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  theme_tailor: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
