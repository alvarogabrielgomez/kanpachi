# kanpachi-seed: nodo de rendezvous + registro de salas.
#
# Dos procesos, dos contenedores, un solo espacio de red. El de EasyTier
# presenta a los peers entre sí y coordina el hole punch, y NO se une a ninguna
# sala: no lleva --network-name ni --network-secret, así que jamás ve el
# secreto de una red y no puede descifrar nada. Lo único que observa son
# networkIDs opacos y las IPs públicas de quienes los anuncian.
#
# El registro es código nuestro, y es lo que hace que esto sea kanpachi-seed y
# no una instalación plana de EasyTier: emite invite IDs, guarda una tarjeta de
# presentación que no puede leer, y publica cuánta gente hay en cada sala. Ver
# la decisión 24 de docs/02-decisiones-de-diseno.md.
#
# Convive con las cargas de Accentio en el mismo droplet, aislado en su propia
# red de contenedores.
services:
  kanpachi-seed:
    image: easytier/easytier:v2.6.4
    container_name: kanpachi-seed
    restart: unless-stopped
    command:
      - "--listeners"
      - "tcp://0.0.0.0:11010"
      - "--listeners"
      - "udp://0.0.0.0:11010"
      # El seed corre en una VM con IP pública directa. No hay NAT que
      # perforar ni router que mapear, así que UPnP no aporta nada y sí
      # contradice la invariante de que el router de nadie se toca. Viene
      # ENCENDIDO por defecto en el motor, hay que apagarlo a mano.
      - "--disable-upnp"
      - "true"
      # El portal RPC es el panel de control del motor. NO se publica al host:
      # solo es alcanzable desde dentro de kanpachi-net, o sea desde el
      # registro y nadie más, y encima con lista blanca a esa subred.
      #
      # OJO, esto se aparta a propósito del invariante "el portal RPC va fijado
      # a 127.0.0.1" de docs/CLAUDE.md. Ese invariante es del CLIENTE, donde el
      # portal convive con el escritorio del usuario y cualquier proceso suyo
      # podría hablarle. Acá el motor está solo en un contenedor y quien
      # necesita leerlo vive en otro, así que atarlo al loopback exigía
      # compartir espacio de red, y eso resultó peor: al reiniciarse el motor,
      # el registro se quedaba con el espacio de red destruido y la página de
      # invitación moría en silencio. Comprobado, no supuesto.
      - "--rpc-portal"
      - "0.0.0.0:15888"
      - "--rpc-portal-whitelist"
      - "127.0.0.1,10.77.7.0/24"
      # Sin TUN: el seed no necesita una interfaz virtual para presentar peers,
      # y así el contenedor no requiere NET_ADMIN ni /dev/net/tun.
      - "--no-tun"
      - "true"
      # STUN sirve para descubrir el propio NAT. Este nodo tiene IP pública
      # directa, así que no tiene NAT que descubrir. Con la lista vacía deja
      # de hablar con los servidores STUN por defecto del motor, que son de
      # terceros y estaban recibiendo tráfico saliente desde el droplet de
      # producción sin que nadie lo hubiera decidido.
      - "--stun-servers"
      - "--stun-servers-v6"
      - "--console-log-level"
      - "info"
    ports:
      - "11010:11010/tcp"
      - "11010:11010/udp"
    networks:
      - kanpachi-net
    # El droplet tiene 2 núcleos y poca RAM libre, y comparte casa con
    # Vaultwarden, Logto y varias bases de datos. Un relay sin techo es el
    # único costo variable del proyecto y el único vector de abuso, así que
    # el límite no es opcional.
    mem_limit: 256m
    # cpu_quota y cpu_period explícitos en vez de `cpus: 0.5`. Con Compose
    # v2.17 esa forma se acepta sin error y NO llega al contenedor: docker
    # inspect mostraba CpuQuota 0, o sea sin techo. Verificado tras desplegar.
    cpu_period: 100000
    cpu_quota: 50000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kanpachi-registry:
    build:
      # El contexto es la raíz del repositorio: el registro necesita el módulo
      # Go entero y la página de invitación.
      context: ..
      dockerfile: registry/Dockerfile
    image: kanpachi-registry:local
    container_name: kanpachi-registry
    restart: unless-stopped
    command:
      - "--addr"
      - "0.0.0.0:8010"
      - "--page"
      - "/srv/index.html"
      # Por nombre de servicio, no por localhost. Cada contenedor tiene su
      # propio espacio de red, y llegar al motor por la red del compose es lo
      # que hace que reiniciar el motor no rompa el registro.
      - "--rpc-portal"
      - "kanpachi-seed:15888"
    ports:
      # Atado al loopback del host: solo el nginx del droplet llega, igual que
      # Vaultwarden. Dentro del contenedor escucha en 0.0.0.0 porque publicar
      # un puerto hace DNAT hacia la IP del contenedor y no hacia su loopback.
      - "127.0.0.1:8010:8010"
    networks:
      - kanpachi-net
    depends_on:
      - kanpachi-seed
    healthcheck:
      # /healthz devuelve 503 si el motor dejó de contestar, así que esto
      # detecta también el caso en que el registro sigue en pie sirviendo
      # páginas sin contador. Docker lo marca unhealthy y se ve en `ps`.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8010/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Es un servidor HTTP con un mapa en memoria y sin disco. El techo existe
    # para que una avalancha de registros no le quite RAM al resto del droplet.
    mem_limit: 96m
    cpu_period: 100000
    cpu_quota: 25000
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  kanpachi-net:
    driver: bridge
    name: kanpachi-net
    ipam:
      config:
        # Subred fijada a propósito: la lista blanca del portal RPC la nombra,
        # así que no puede depender de lo que Docker asigne ese día. Fuera del
        # pool por defecto de Docker (172.17-172.31) para no chocar con las
        # otras once redes del droplet, y fuera de 100.64.0.0/10, que es el
        # rango que Kanpachi usa para las salas.
        - subnet: 10.77.7.0/24
