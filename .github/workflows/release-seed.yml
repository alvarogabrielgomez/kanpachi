# Publishes the seed's Linux payload: the binaries, the page and their checksums.
#
# **Same trigger as `release.yml`, and that is no accident.** A `v*` tag cuts the
# PRODUCT's version, not the Windows client's: the installer and the seed come
# out numbered the same, from the same tag, even when one of the two changed
# nothing. That "extra" release is cheap and buys something that cannot be
# bought later: looking at a droplet, seeing `v0.1.0`, and knowing which client
# it is running against without crossing two numbering schemes.
#
# This used to trigger on `seed-v*`, and that tag no longer exists. Having it
# would mean being able to publish a release WITHOUT `kanpachi-setup.exe`, which
# would take `latest` with it and leave the download page's permanent URL
# pointing at a publication with no installer.
#
# Both workflows write into the SAME release and neither waits for the other.
# This one takes a minute and the Windows one takes twenty, so in between there
# is a published release still missing its installer. That is accepted
# knowingly: it closes by itself, and the alternative was a single workflow
# where twenty minutes of Windows delay a Linux payload that was already ready.
#
# And if one of the three FAILS, the gap stops being temporary: the release
# stays published without that piece until somebody relaunches the workflow.
# That is accepted too, and for the same reason: the run stays red and named,
# which is where people look, and chaining the three to cover it would cost the
# independence that is the whole point of keeping them apart.
#
# **The scripts do the work.** What stays here is the event, the checkout, the
# toolchain, the version derived from the tag, and the publishing. Building and
# testing live in `scripts/`, so republishing the seed by hand is a command and
# not a reading of this file.
name: Seed release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  # The manual run stays, and it is the way to rebuild the seed on its own
  # without touching the Windows client: with no `tag` it leaves the payload as
  # an artifact, and with `tag` it uploads it to whichever release it is told.
  # That is what makes it possible to fix something in the seed and republish it
  # without twenty minutes of Windows in the middle, and without cutting a new
  # version of the whole product.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to upload the payload to. Empty = artifact only, publishes nothing"
        default: ""

concurrency:
  group: release-seed-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: kanpseed for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # The WHOLE tag, with its `v`. It is what GitHub's API returns in
          # `tag_name`, and `kanpseed upgrade` compares its own version against
          # that: stripping the `v` here would force normalising at the other
          # end.
          #
          # - push of a local tag: GITHUB_REF_TYPE=tag
          # - release published from the web: github.event.release.tag_name
          # - by hand WITH a tag: the seed is rebuilt and uploaded to that
          #   release, with its real number. That is a republication, not a test.
          # - by hand WITHOUT a tag: it stays "dev" ON PURPOSE. A test binary
          #   announcing itself as a real version would make a droplet declare
          #   itself up to date with something nobody published.
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          fi
          echo "VERSION=${TAG:-dev}" >> "$GITHUB_ENV"
          echo "release_target=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify the release-seed surface
        # Publishing a binary that does not pass its tests is worse than not
        # publishing.
        #
        # `internal/arch` is in because this workflow ALSO publishes the page:
        # that is where the guards live that tie its invite ID alphabet, its
        # default seed and its invariants to Go's domain. Without them it would
        # be possible to publish a page that accepts codes the app rejects.
        shell: pwsh
        run: ./scripts/verify.ps1 -Surface release-seed

      # The two binaries, the page and its manifest. Why there are two
      # architectures, why they go without `-s -w`, why the version travels with
      # its `v` and why the manifest is called `-seed-linux`: all of it in the
      # script's header, which is where whoever runs it by hand can read it.
      - name: Build the seed payload
        run: scripts/build-seed.sh --version "$VERSION" --out dist

      # It publishes when there is a release to upload to, and the version step
      # decided that. Asking it again here, with a different expression, is how
      # the two places drift apart.
      - name: Publish to the release
        if: steps.version.outputs.release_target != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_target }}
          # No body: the release's text is written by `release.yml`, which is
          # the one that knows the installer's SHA. Two workflows writing the
          # same body would give a different order on every publication.
          fail_on_unmatched_files: true
          files: |
            dist/kanpseed-linux-amd64
            dist/kanpseed-linux-arm64
            dist/index.html
            dist/SHA256SUMS-seed-linux

      # With nothing to publish to, the manual run leaves the payload as an
      # artifact, so this whole workflow can be tested without cutting a version.
      - name: Keep the payload as an artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kanpseed-linux
          path: dist/
