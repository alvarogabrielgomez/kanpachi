# Publica el instalador de Windows.
#
# Un tag `v*` produce `kanpachi-setup.exe` y sus sumas. El nombre del fichero NO
# lleva la versión, y eso es deliberado: la página de descarga apunta a
# `releases/latest/download/kanpachi-setup.exe`, que es una URL permanente que
# GitHub redirige a la última publicación. Con el nombre versionado, cada
# release obligaría a editar la página, y la página que hay que editar a mano es
# la que se queda desactualizada. La versión viaja dentro del ejecutable, en su
# VersionInfo, y en el título de la publicación.
#
# Sin firmar todavía. Windows va a enseñar el aviso de SmartScreen, y eso está
# dicho en el cuerpo de la publicación en vez de disimulado. La firma con
# SignPath entra cuando la solicitud esté aprobada: ver `docs/07-futuro.md`.
name: Release

# **Los dos disparadores automáticos son necesarios, y no es cinturón y
# tirantes.** Un tag empujado con `git push --tags` llega por `push`. Un release
# creado desde la web de GitHub, que crea el tag por dentro, NO produjo ninguna
# corrida de `push` acá: el tag `v0.1.0` del 2026-08-06 existió, el fichero ya
# estaba en su commit con `push: tags`, y la API de Actions no registró nada.
# Ese camino entra por `release: published`.
#
# OJO con la consecuencia: para un release de la web, el fichero que se ejecuta
# es el del COMMIT QUE APUNTA EL TAG. Etiquetar un commit anterior a este
# párrafo vuelve a no disparar nada, y no hay arreglo posible en `main` para
# eso: el tag tiene que salir de un commit que ya traiga este `on:`.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      motor:
        description: "Ref del repositorio del motor con el que compilar"
        default: main

# Empujar el tag Y crear el release sobre ese mismo tag son dos eventos para una
# sola publicación. Sin esto se compilaría dos veces lo mismo durante veinte
# minutos cada vez; con esto, la segunda cancela a la primera y publica.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  instalador:
    name: kanpachi-setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # **El motor vive en otro repositorio y se compila acá.**
      #
      # No se baja de una publicación suya porque todavía no tiene ninguna: hoy
      # ese repositorio solo compila en cada push. Compilarlo desde el fuente es
      # lo que hace que este workflow produzca la carga entera sin depender de
      # que alguien suba un binario a mano.
      #
      # El ref queda anotado en el cuerpo de la publicación. Es lo que hace
      # reconstruible este instalador: sin eso, "la versión 0.1.0" no dice con
      # qué motor se armó.
      - uses: actions/checkout@v4
        with:
          repository: alvarogabrielgomez/kanpachi-engine
          ref: ${{ inputs.motor || 'main' }}
          path: motor

      - name: Versión
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # `v0.1.0` -> `0.1.0`.
          #
          # - push por tag local: viene por GITHUB_REF_TYPE=tag
          # - release publicada por web: viene por github.event.release.tag_name
          # - workflow_dispatch: no hay tag, se publica como 0.0.0 para pruebas
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          fi

          if [ -z "$TAG" ]; then
            VER="0.0.0"
          else
            VER="${TAG#v}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          # VersionInfoVersion de Inno tiene que ser numérica, así que un
          # `0.2.0-rc1` pierde el sufijo SOLO para ese campo. El nombre de la
          # publicación conserva el tag entero.
          echo "VERSION_NUM=${VER%%-*}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fijada por SHA y no por tag, por lo mismo que en ci.yml: corre en el
      # mismo trabajo que el checkout, así que un tag movido ejecutaría código
      # nuevo sobre este fuente sin que nada en el diff lo diga.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      # Lo que la cadena de Rust del motor necesita, y cada cosa por su razón.
      # Es lo mismo que hace `build.yml` del otro repositorio.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: protoc y libclang para el motor
        run: |
          choco install protoc --no-progress -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Compilar el motor
        working-directory: motor
        run: cargo build --release

      # **Lo que se publica pasa por los tests que pasan hoy.**
      #
      # `core` es el dominio y los casos de uso, y `internal/arch` son los
      # guardianes que atan las dos puntas del cable: el alfabeto del invite ID,
      # la página de invitación, y el cableado que ya se quedó sin llamar tres
      # veces en este repositorio.
      #
      # La UI también cruza el repositorio REAL del pipe en sus tests, sobre un
      # transporte de bytes en memoria. El repositorio falso que antes dejaba
      # la suite sin compilar ya no existe, así que el instalador vuelve a estar
      # gobernado por `flutter analyze` y `flutter test` antes de empaquetarse.
      # **Sin este paso no hay instalador, y por eso este workflow no publicó
      # nunca nada.**
      #
      # `/third_party/` está en .gitignore por tamaño (~80 MB), así que el
      # checkout llega SIN `Packet.dll`, `wintun.dll` ni `WinDivert64.sys`, y
      # `preparar-carga.ps1` corta con "falta third_party\easytier\Packet.dll".
      # En la máquina de desarrollo los ficheros están de antes y no se nota; en
      # un runner limpio no hay de dónde sacarlos.
      #
      # Se bajan los SIETE del release oficial, no los tres que se empaquetan.
      # Con el directorio completo, el guardián de `internal/arch` del paso
      # siguiente verifica el manifiesto entero contra `easytier.sums` en vez de
      # saltárselo por directorio ausente: acá es donde esa comprobación de
      # cadena de suministro pasa de intención a hecho.
      #
      # La versión se escribe acá y el hash NO: si este `v2.6.4` se separa del
      # pin de `easytier.sums` y de docs/02, el test del paso siguiente falla
      # fichero por fichero. Un tercer lugar donde copiar hashes sería un tercer
      # lugar donde quedan viejos.
      - name: Los binarios del motor
        shell: pwsh
        run: |
          $url = "https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/easytier-windows-x86_64-v2.6.4.zip"
          $zip = "$env:RUNNER_TEMP\easytier.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\easytier" -Force
          $destino = "$env:GITHUB_WORKSPACE\third_party\easytier"
          New-Item -ItemType Directory -Force -Path $destino | Out-Null
          # El zip trae todo bajo una carpeta `easytier-windows-x86_64\`; el
          # manifiesto lista las rutas relativas a `third_party\easytier`, así
          # que se aplana acá.
          Copy-Item -Path "$env:RUNNER_TEMP\easytier\easytier-windows-x86_64\*" -Destination $destino -Force
          Get-ChildItem $destino | Format-Table Name, Length

      - name: Tests de Go
        run: go test -count=1 ./core/... ./internal/arch/...

      - name: Tests de Flutter
        working-directory: ui
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Armar la carga
        shell: pwsh
        run: |
          .\scripts\preparar-carga.ps1 `
            -Salida "$env:GITHUB_WORKSPACE\dist\carga" `
            -Motor  "$env:GITHUB_WORKSPACE\motor\target\release\kanpachi-engine.exe" `
            -Version "$env:VERSION"

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Empaquetar
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DCarga=$env:GITHUB_WORKSPACE\dist\carga" `
            "/DAppVersion=$env:VERSION" `
            "/DVersionInfo=$env:VERSION_NUM" `
            "/O$env:GITHUB_WORKSPACE\dist" `
            "installer\kanpachi.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC salio con $LASTEXITCODE" }

      # **El portable sale del MISMO tag que el instalador**, y por eso se arma
      # acá y no en un workflow aparte. Son dos formas de repartir el mismo
      # producto: si se publicaran por separado, un amigo con el portable y otro
      # con el instalado estarían en versiones distintas sin nada que lo diga, y
      # el protocolo entre el daemon y el motor decodifica estricto.
      #
      # El motor se pasa EXPLÍCITO, el mismo que acaba de compilarse arriba. El
      # script sabe elegir el más reciente por su cuenta y acá no hay nada entre
      # lo que elegir; lo que sí hace igual es la verificación cruzada por
      # SHA256 entre el que se le nombró y el que acabó dentro del bundle.
      #
      # Su comprobación de "el motor no es más viejo que su código" no corre acá,
      # porque busca el repositorio del motor como hermano de este y en el runner
      # está en `motor\`. No hace falta: se compiló en este mismo trabajo, tres
      # pasos más arriba, así que no puede ser viejo.
      #
      # Lo que cuesta: la interfaz de Flutter se compila DOS veces en release,
      # una para la carga del instalador y otra para el bundle. Son un par de
      # minutos, y a cambio las dos salidas usan la misma receta que se usa a
      # mano, sin una tercera lista de ficheros que mantener.
      - name: Armar el portable
        shell: pwsh
        run: |
          .\scripts\build_portable_bundle.ps1 `
            -Salida "$env:GITHUB_WORKSPACE\dist\kanpachi-portable.exe" `
            -Motor  "$env:GITHUB_WORKSPACE\motor\target\release\kanpachi-engine.exe"

      - name: Sumas
        id: sums
        shell: pwsh
        run: |
          # El mismo formato que espera `sha256sum -c`, para que las dos cargas
          # del release se verifiquen igual.
          #
          # El nombre lleva `-windows` porque este release trae TAMBIÉN la carga
          # de Linux, que publica `release-seed.yml` en paralelo. Con los dos
          # llamándose `SHA256SUMS`, el último en subir pisaba al otro y dejaba
          # a `install.sh` verificando binarios que no salían en el archivo.
          #
          # Los DOS ejecutables de Windows van en el mismo archivo: son la misma
          # carga repartida de dos formas, y quien verifique uno tiene que poder
          # verificar el otro sin buscar en otro sitio.
          function Suma($nombre) {
            $f = Get-Item "$env:GITHUB_WORKSPACE\dist\$nombre"
            return (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
          }
          $setup    = Suma 'kanpachi-setup.exe'
          $portable = Suma 'kanpachi-portable.exe'

          @(
            "$setup  kanpachi-setup.exe"
            "$portable  kanpachi-portable.exe"
          ) | Out-File -FilePath "$env:GITHUB_WORKSPACE\dist\SHA256SUMS-windows" -Encoding ascii
          Get-Content "$env:GITHUB_WORKSPACE\dist\SHA256SUMS-windows"

          "setup_sha=$setup"       | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portable_sha=$portable" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # El tramo del CHANGELOG que le toca a esta versión, para el cuerpo de la
      # publicación.
      #
      # **Se saca del archivo y no se escribe a mano en el release.** Escribirlo
      # dos veces es tenerlo distinto dos veces, y el que la gente lee sería el
      # que nadie revisó. El archivo ya se mantiene entrada a entrada, en el
      # mismo commit que el cambio; esto solo lo cita.
      #
      # **Sin entrada no hay publicación, y eso es a propósito.** Una versión
      # etiquetada sin una línea que diga qué cambió es exactamente lo que este
      # archivo existe para impedir, y el momento de enterarse es antes de
      # publicar, no después. La corrida manual queda fuera: ahí la versión es
      # `0.0.0` y no hay nada que citar.
      - name: Notas de la versión
        id: notas
        shell: pwsh
        run: |
          if ($env:VERSION -eq '0.0.0') {
            "notas<<KANPACHI_FIN"      | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "_Corrida manual, sin tag: no hay tramo de changelog que citar._" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "KANPACHI_FIN"             | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $lineas = Get-Content "$env:GITHUB_WORKSPACE\CHANGELOG.md"
          $cabecera = "^##\s+\[$([regex]::Escape($env:VERSION))\]"
          $desde = ($lineas | Select-String -Pattern $cabecera | Select-Object -First 1).LineNumber
          if (-not $desde) {
            throw "CHANGELOG.md no tiene la seccion de la version $env:VERSION. " +
                  "Antes de etiquetar, la seccion Unreleased se convierte en '## [$env:VERSION] - AAAA-MM-DD'."
          }

          # `LineNumber` es 1-based y el corte va DESPUÉS de la cabecera, así
          # que este índice ya apunta a la línea siguiente.
          $resto = $lineas[$desde..($lineas.Count - 1)]
          $hasta = ($resto | Select-String -Pattern '^##\s' | Select-Object -First 1).LineNumber
          # El `-eq 1` no es defensa de más: con la sección vacía, `0..-1` en
          # PowerShell no es un rango vacío, devuelve el primer elemento y el
          # último. O sea que el caso a detectar saldría con dos líneas de otra
          # versión pegadas, en vez de saltar.
          $cuerpo = if ($hasta -eq 1) { @() }
                    elseif ($hasta)   { $resto[0..($hasta - 2)] }
                    else              { $resto }

          # Los enlaces de referencia del pie no significan nada fuera del
          # archivo, y `## [0.1.3]` sin su definición saldría como texto suelto.
          $cuerpo = $cuerpo | Where-Object { $_ -notmatch '^\[[0-9]' }
          $texto = ($cuerpo -join "`n").Trim()
          if (-not $texto) { throw "La seccion de $env:VERSION en CHANGELOG.md esta vacia." }

          Write-Host $texto
          "notas<<KANPACHI_FIN" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $texto                | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "KANPACHI_FIN"        | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publicar
        if: github.ref_type == 'tag' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          # Explícito porque las dos entradas nombran el tag en sitios
          # distintos: `github.ref_name` en el push, `event.release.tag_name` en
          # la publicación desde la web.
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          # Sin esto, una publicación creada desde la web perdería el texto que
          # alguien escribió a mano: `body` REEMPLAZA. Con `append_body`, lo de
          # abajo se suma a lo que ya había, y en el camino del tag, donde no
          # había nada, queda igual que antes.
          append_body: true
          # Publicar sin el instalador es lo peor de los dos mundos: una versión
          # anunciada que no se puede instalar, y la URL permanente de la página
          # de descarga apuntando a una publicación vacía.
          fail_on_unmatched_files: true
          files: |
            dist/kanpachi-setup.exe
            dist/kanpachi-portable.exe
            dist/SHA256SUMS-windows
          body: |
            ## What changed

            ${{ steps.notas.outputs.notas }}

            ## Client · Windows 10 and 11, 64-bit

            `kanpachi-setup.exe`

            Installs with **one single UAC prompt**, and that is the only one in
            the life of the product: neither booting the PC nor opening the app
            asks again.

            **Not signed yet.** Windows will show the SmartScreen warning when
            you open it; press "More info" and "Run anyway". Signing arrives
            with the SignPath certificate.

            ```
            SHA256  ${{ steps.sums.outputs.setup_sha }}
            ```

            ### Or run it without installing

            `kanpachi-portable.exe`

            The same product in a single file: double click, accept one UAC
            prompt, and Kanpachi opens. **It installs nothing** — no service, no
            autostart entry, no shortcuts, no ProgramData. The only thing it
            leaves behind is its log, beside the executable, which is what to
            send when something goes wrong.

            What it costs, said plainly: one UAC prompt per run instead of one
            per lifetime, it does not start with Windows, and it forgets its
            identity between runs, so "back to the last room" does not carry
            over. Use it to try Kanpachi out or to help somebody debug; install
            it to play regularly.

            ```
            SHA256  ${{ steps.sums.outputs.portable_sha }}
            ```

            Engine built from `alvarogabrielgomez/kanpachi-engine@${{ inputs.motor || 'main' }}`.

            ## Rendezvous node · Linux

            `kanpseed-linux-amd64`, `kanpseed-linux-arm64`, `index.html`

            Comes out of the same tag as the client, so both halves of the
            product carry the same number. To install or upgrade:

            ```
            curl -fsSL https://raw.githubusercontent.com/alvarogabrielgomez/kanpachi/main/seed/install.sh | sudo sh
            ```

            On a seed that is already installed, also:

            ```
            sudo kanpseed upgrade --check
            sudo kanpseed upgrade
            ```

            Each payload ships its own manifest: `SHA256SUMS-windows` and
            `SHA256SUMS-linux`.

      # Sin publicar, la corrida manual deja el instalador como artefacto. Es lo
      # que permite probar este workflow entero sin crear un tag ni una
      # publicación que después haya que borrar.
      - name: Guardar el instalador
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kanpachi-setup
          path: |
            dist/kanpachi-setup.exe
            dist/kanpachi-portable.exe
            dist/SHA256SUMS-windows
