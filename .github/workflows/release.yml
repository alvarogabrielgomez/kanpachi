# Publica el instalador de Windows.
#
# Un tag `v*` produce `kanpachi-setup.exe` y sus sumas. El nombre del fichero NO
# lleva la versión, y eso es deliberado: la página de descarga apunta a
# `releases/latest/download/kanpachi-setup.exe`, que es una URL permanente que
# GitHub redirige a la última publicación. Con el nombre versionado, cada
# release obligaría a editar la página, y la página que hay que editar a mano es
# la que se queda desactualizada. La versión viaja dentro del ejecutable, en su
# VersionInfo, y en el título de la publicación.
#
# **El trabajo lo hacen los scripts, no este fichero.** Acá quedan los eventos,
# los checkouts, los toolchains, la versión derivada del evento y la
# publicación. Lo que compila, prueba y empaqueta vive en `scripts/`, así que
# una persona puede reproducir una publicación entera sin leer este YAML.
#
# Sin firmar todavía. Windows va a enseñar el aviso de SmartScreen, y eso está
# dicho en el cuerpo de la publicación en vez de disimulado. La firma con
# SignPath entra cuando la solicitud esté aprobada: ver `docs/07-futuro.md`.
name: Release

# **Los dos disparadores automáticos son necesarios, y no es cinturón y
# tirantes.** Un tag empujado con `git push --tags` llega por `push`. Un release
# creado desde la web de GitHub, que crea el tag por dentro, NO produjo ninguna
# corrida de `push` acá: el tag `v0.1.0` del 2026-08-06 existió, el fichero ya
# estaba en su commit con `push: tags`, y la API de Actions no registró nada.
# Ese camino entra por `release: published`.
#
# OJO con la consecuencia: para un release de la web, el fichero que se ejecuta
# es el del COMMIT QUE APUNTA EL TAG. Etiquetar un commit anterior a este
# párrafo vuelve a no disparar nada, y no hay arreglo posible en `main` para
# eso: el tag tiene que salir de un commit que ya traiga este `on:`. Lo mismo
# vale para los scripts que llama: el commit del tag trae su YAML y sus scripts,
# consistentes entre sí.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      motor:
        description: "Tag del motor a empaquetar, saltándose el pin. Vacío usa engine.pin"
        default: ""

# Empujar el tag Y crear el release sobre ese mismo tag son dos eventos para una
# sola publicación. Sin esto se compilaría dos veces lo mismo durante veinte
# minutos cada vez; con esto, la segunda cancela a la primera y publica.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  instalador:
    name: kanpachi-setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # **El motor vive en otro repositorio, se publica POR TAG, y acá se
      # DESCARGA.** Hasta el 2026-08-19 se compilaba en este job, y eso tenía
      # dos defectos que la descarga mata de una vez: el binario que pasaba la
      # aduana del motor (clippy, tests, el barrido de listeners) no era el que
      # viajaba —era otra compilación del mismo ref—, y el ref era `main`, un
      # puntero móvil que no reconstruye nada. Hoy el binario publicado ES el
      # que pasó la aduana, el pin es contenido (tag + SHA256 en `engine.pin`),
      # y este job tarda segundos de descarga en vez de doce minutos de Rust.
      #
      # La espera de 25 minutos cubre la carrera real: taguear el motor y
      # taguear Kanpachi seguido, con la aduana del motor todavía publicando.
      # Con tope, porque un motor que nunca va a publicar (aduana roja) tiene
      # que dejar este release ROJO con nombre y apellido, no colgado.
      #
      # `inputs.motor` (solo workflow_dispatch) salta el pin y nombra otro tag:
      # ahí no hay hash que exigir y se dice a gritos en el log. El binario se
      # delata igual, porque lleva su build id sellado dentro.
      - name: El motor, del release de su tag
        shell: pwsh
        run: |
          $pin = @{}
          Get-Content engine.pin | Where-Object { $_ -match '^\S' -and $_ -notmatch '^#' } | ForEach-Object {
            $parts = $_ -split '\s+', 2; $pin[$parts[0]] = $parts[1].Trim()
          }
          $tag = if ('${{ inputs.motor }}') { '${{ inputs.motor }}' } else { $pin['tag'] }
          $url = "https://github.com/alvarogabrielgomez/kanpachi-engine/releases/download/$tag/kanpachi-engine.exe"
          New-Item -ItemType Directory -Force engine | Out-Null
          $deadline = (Get-Date).AddMinutes(25)
          while ($true) {
            try {
              Invoke-WebRequest -Uri $url -OutFile engine\kanpachi-engine.exe -MaximumRedirection 8
              break
            } catch {
              if ((Get-Date) -gt $deadline) { throw "engine $tag no publico kanpachi-engine.exe en 25 minutos: $_" }
              Write-Host "engine $tag aun sin assets, reintento en 30s..."
              Start-Sleep -Seconds 30
            }
          }
          $sha = (Get-FileHash engine\kanpachi-engine.exe -Algorithm SHA256).Hash.ToLower()
          if ('${{ inputs.motor }}') {
            Write-Host "::warning::motor $tag por inputs.motor, SIN verificar contra engine.pin. SHA256 $sha"
          } elseif ($sha -ne $pin['sha256-windows'].ToLower()) {
            throw "el kanpachi-engine.exe de $tag no es el del pin.`n  pin:      $($pin['sha256-windows'])`n  bajado:   $sha"
          } else {
            Write-Host "engine $tag verificado: $sha"
          }
          echo "ENGINE_TAG=$tag" >> $env:GITHUB_ENV

      # La versión sale del EVENTO, así que se deriva acá y no en un script: es
      # lo único de este job que no es trabajo sino contexto de Actions.
      - name: Versión
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # `v0.1.0` -> `0.1.0`.
          #
          # - push por tag local: viene por GITHUB_REF_TYPE=tag
          # - release publicada por web: viene por github.event.release.tag_name
          # - workflow_dispatch: no hay tag, se publica como 0.0.0 para pruebas
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          fi

          if [ -z "$TAG" ]; then
            VER="0.0.0"
          else
            VER="${TAG#v}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          # VersionInfoVersion de Inno tiene que ser numérica, así que un
          # `0.2.0-rc1` pierde el sufijo SOLO para ese campo. El nombre de la
          # publicación conserva el tag entero.
          echo "VERSION_NUM=${VER%%-*}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fijada por SHA y no por tag, por lo mismo que en ci.yml: corre en el
      # mismo trabajo que el checkout, así que un tag movido ejecutaría código
      # nuevo sobre este fuente sin que nada en el diff lo diga.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      # `/third_party/` está en .gitignore por tamaño (~80 MB), así que el
      # checkout llega SIN las DLL del motor y el empaquetado cortaría. El
      # script las baja del release oficial, y por qué se bajan las SIETE y no
      # las tres que se empaquetan está en su cabecera: con el directorio
      # completo, el guardián de suministro de `internal/arch` verifica el
      # manifiesto entero en vez de saltárselo por directorio ausente.
      - name: Los binarios del motor
        shell: pwsh
        run: .\scripts\fetch-third-party.ps1

      # **Lo que se publica pasa por los tests que pasan hoy**, ni más ni menos:
      # `core`, los guardianes de `internal/arch`, y la UI con `analyze` y
      # `test`. Cuáles y por qué, en la cabecera del script.
      - name: Los chequeos de esta superficie
        shell: pwsh
        run: .\scripts\verify.ps1 -Surface release-windows

      # Sella la versión en los recursos, arma la carga, corre Inno Setup, arma
      # el portable y escribe SHA256SUMS-windows. Los cinco pasos y sus razones
      # están en la cabecera del script, que es lo que permite reproducir una
      # publicación a mano con una sola orden.
      - name: Empaquetar el cliente de Windows
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 `
            -Version "$env:VERSION" `
            -VersionNum "$env:VERSION_NUM" `
            -Engine "$env:GITHUB_WORKSPACE\engine\kanpachi-engine.exe" `
            -Repo "${{ github.repository }}" `
            -Output "$env:GITHUB_WORKSPACE\dist"

      # Los dos hashes salen del manifiesto que acaba de escribir el script, y
      # no se calculan otra vez: dos cálculos son dos oportunidades de publicar
      # un número que no es el del fichero que se subió.
      - name: Sumas
        id: sums
        shell: pwsh
        run: |
          $sumas = @{}
          foreach ($linea in Get-Content "$env:GITHUB_WORKSPACE\dist\SHA256SUMS-windows") {
            $partes = $linea -split '\s+', 2
            $sumas[$partes[1].Trim()] = $partes[0]
          }
          "setup_sha=$($sumas['kanpachi-setup.exe'])"       | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portable_sha=$($sumas['kanpachi-portable.exe'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # El tramo del CHANGELOG que le toca a esta versión, para el cuerpo de la
      # publicación. Sin entrada no hay publicación, y eso es a propósito: el
      # motivo está en la cabecera del script.
      - name: Notas de la versión
        id: notas
        shell: pwsh
        run: |
          $texto = .\scripts\release-notes.ps1 -Version "$env:VERSION" | Out-String
          "notas<<KANPACHI_FIN" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $texto.TrimEnd()      | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "KANPACHI_FIN"        | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publicar
        if: github.ref_type == 'tag' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          # Explícito porque las dos entradas nombran el tag en sitios
          # distintos: `github.ref_name` en el push, `event.release.tag_name` en
          # la publicación desde la web.
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          # Sin esto, una publicación creada desde la web perdería el texto que
          # alguien escribió a mano: `body` REEMPLAZA. Con `append_body`, lo de
          # abajo se suma a lo que ya había, y en el camino del tag, donde no
          # había nada, queda igual que antes.
          append_body: true
          # Publicar sin el instalador es lo peor de los dos mundos: una versión
          # anunciada que no se puede instalar, y la URL permanente de la página
          # de descarga apuntando a una publicación vacía.
          fail_on_unmatched_files: true
          files: |
            dist/kanpachi-setup.exe
            dist/kanpachi-portable.exe
            dist/SHA256SUMS-windows
          body: |
            ## What changed

            ${{ steps.notas.outputs.notas }}

            ## Client · Windows 10 and 11, 64-bit

            `kanpachi-setup.exe`

            Installs with **one single UAC prompt**, and that is the only one in
            the life of the product: neither booting the PC nor opening the app
            asks again.

            **Not signed yet.** Windows will show the SmartScreen warning when
            you open it; press "More info" and "Run anyway". Signing arrives
            with the SignPath certificate.

            ```
            SHA256  ${{ steps.sums.outputs.setup_sha }}
            ```

            ### Or run it without installing

            `kanpachi-portable.exe`

            The same product in a single file: double click, accept one UAC
            prompt, and Kanpachi opens. **It installs nothing** — no service, no
            autostart entry, no shortcuts, no ProgramData. The only thing it
            leaves behind is its log, beside the executable, which is what to
            send when something goes wrong.

            What it costs, said plainly: one UAC prompt per run instead of one
            per lifetime, it does not start with Windows, and it forgets its
            identity between runs, so "back to the last room" does not carry
            over. Use it to try Kanpachi out or to help somebody debug; install
            it to play regularly.

            ```
            SHA256  ${{ steps.sums.outputs.portable_sha }}
            ```

            Engine `${{ env.ENGINE_TAG }}`, downloaded from its own release and
            verified against `engine.pin` — the binary that passed the engine's
            customs is the binary inside this installer.

            ## Client · Linux, amd64

            `kanpachi-amd64.deb`

            ```
            curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/kanpachi-amd64.deb
            sudo apt install ./kanpachi-amd64.deb
            ```

            Headless: no window, and the client is the `kanpachi` command, with
            a wizard when you run it with no arguments. Built on Ubuntu 22.04 so
            it also runs on 24.04.

            It installs two systemd units. `kanpachid` is the daemon.
            `kanpachi-quarantine` is the one that matters and the one nobody
            sees: it loads before the network comes up and it is what keeps the
            game ports closed from the internet **with Kanpachi switched off**.

            `sudo kanpachi doctor` checks the machine and writes nothing;
            `--fix` repairs what belongs to Kanpachi, and the one foreign thing
            it touches — a ufw or firewalld about to swallow the room — it
            opens only for Kanpachi's two adapters, says so, writes it down,
            and undoes it when the room closes. Docker and everything else
            stay untouched. `sudo kanpachi upgrade` brings the next version.

            The SHA256 is in `SHA256SUMS-linux`, which is built in its own job:

            ```
            sha256sum -c SHA256SUMS-linux --ignore-missing
            ```

            ## Rendezvous node · Linux

            `kanpseed-linux-amd64`, `kanpseed-linux-arm64`, `index.html`

            Comes out of the same tag as the client, so both halves of the
            product carry the same number. To install or upgrade:

            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/seed/install.sh | sudo sh
            ```

            On a seed that is already installed, also:

            ```
            sudo kanpseed upgrade --check
            sudo kanpseed upgrade
            ```

            Each payload ships its own manifest: `SHA256SUMS-windows`,
            `SHA256SUMS-linux` for the Linux client, and `SHA256SUMS-seed-linux`
            for the seed.

      # Sin publicar, la corrida manual deja el instalador como artefacto. Es lo
      # que permite probar este workflow entero sin crear un tag ni una
      # publicación que después haya que borrar.
      - name: Guardar el instalador
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kanpachi-setup
          path: |
            dist/kanpachi-setup.exe
            dist/kanpachi-portable.exe
            dist/SHA256SUMS-windows

  # The Linux client, which is a THIRD job writing into the same release.
  #
  # # Why a separate job and not a step of the one above
  #
  # Because each artifact is compiled on its own system, and that is not a
  # preference. The engine on Linux pulls in vendored dbus, zstd-sys and kcp-sys
  # with bindgen, so cross-compiling from Windows would mean three C toolchains
  # with a Linux linker and sysroot wired up by hand. Same rule the Windows job
  # already states for the other direction.
  #
  # # Why ubuntu-22.04 and not ubuntu-latest
  #
  # The glibc floor decides where the package runs, and only the ENGINE has one:
  # the two Go binaries are built with CGO off. Built on 24.04 it demands
  # GLIBC_2.39 and does NOT start on 22.04, which is the release most often
  # found on a VPS. Built here it demands 2.35 or less and runs on both. This is
  # a release decision, so it lives in the workflow and not in the code — and
  # the check that ENFORCES it lives in `build-deb.sh --strict`, which is the
  # same check a person gets as a warning without the flag.
  #
  # It does not wait for the Windows job and the Windows job does not wait for
  # it. That is the same trade already accepted for the seed: a window exists
  # where the release is published with some payloads missing, it closes by
  # itself, and the alternative was twenty minutes of Windows delaying a Linux
  # payload that was ready.
  paquete-linux:
    name: kanpachi-amd64.deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Versión
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Same three entry points as the other two jobs. With no tag the
          # version is 0.0.0 and nothing is published: a package that announced
          # itself as a real version would make `kanpachi upgrade` on somebody's
          # server compare against something nobody released.
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "VERSION=${TAG:-0.0.0}" >> "$GITHUB_ENV"
          echo "release_target=$TAG" >> "$GITHUB_OUTPUT"

      # La mitad Linux de la misma descarga del job de Windows: el binario que
      # publicó la aduana del motor, verificado contra `engine.pin`. El motivo
      # entero está en el paso homólogo de arriba. La espera acotada es la
      # misma: 25 minutos y rojo con nombre, jamás colgado.
      - name: El motor, del release de su tag
        run: |
          tag="${{ inputs.motor }}"
          if [ -z "$tag" ]; then
            tag=$(awk '$1 == "tag" { print $2 }' engine.pin)
          fi
          url="https://github.com/alvarogabrielgomez/kanpachi-engine/releases/download/$tag/kanpachi-engine"
          mkdir -p engine
          deadline=$(( $(date +%s) + 25*60 ))
          until curl -fsSL -o engine/kanpachi-engine "$url"; do
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "engine $tag no publicó kanpachi-engine en 25 minutos" >&2
              exit 1
            fi
            echo "engine $tag aún sin assets, reintento en 30s..."
            sleep 30
          done
          chmod +x engine/kanpachi-engine
          sha=$(sha256sum engine/kanpachi-engine | awk '{print $1}')
          if [ -n "${{ inputs.motor }}" ]; then
            echo "::warning::motor $tag por inputs.motor, SIN verificar contra engine.pin. SHA256 $sha"
          else
            want=$(awk '$1 == "sha256-linux" { print $2 }' engine.pin)
            if [ "$sha" != "$want" ]; then
              echo "el kanpachi-engine de $tag no es el del pin." >&2
              echo "  pin:    $want" >&2
              echo "  bajado: $sha" >&2
              exit 1
            fi
            echo "engine $tag verificado: $sha"
          fi

      # The same tests the Windows job runs before packaging, and for the same
      # reason: what gets published passes the tests that pass today.
      - name: Los chequeos de esta superficie
        shell: pwsh
        run: ./scripts/verify.ps1 -Surface release-linux

      # `--strict` turns the glibc floor from a warning into a stop, and writes
      # SHA256SUMS-linux beside the package. `SHA256SUMS-linux` is the CLIENT's
      # and the seed's is `SHA256SUMS-seed-linux`: three workflows write into one
      # release, so a shared name means the last one to upload overwrites the
      # others and leaves `kanpachi upgrade` verifying a package that is not
      # listed.
      - name: Armar el paquete
        run: |
          scripts/build-deb.sh \
            --strict \
            --version "$VERSION" \
            --engine engine/kanpachi-engine \
            --out dist

      - name: Publicar
        if: steps.version.outputs.release_target != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_target }}
          # No body: the release text is written by the job above, which is the
          # one that knows the installer's SHA. Two jobs writing the same body
          # would give a different order on every publication.
          fail_on_unmatched_files: true
          files: |
            dist/kanpachi-amd64.deb
            dist/SHA256SUMS-linux

      - name: Guardar el paquete
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kanpachi-deb
          path: |
            dist/kanpachi-amd64.deb
            dist/SHA256SUMS-linux
