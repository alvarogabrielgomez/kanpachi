# Publishes the Windows installer.
#
# A `v*` tag produces `kanpachi-setup.exe` and its checksums. The file name does
# NOT carry the version, and that is deliberate: the download page points at
# `releases/latest/download/kanpachi-setup.exe`, a permanent URL that GitHub
# redirects to the newest publication. With a versioned name, every release
# would force an edit of that page, and the page somebody has to edit by hand is
# the one that goes stale. The version travels inside the executable, in its
# VersionInfo, and in the publication's title.
#
# **The scripts do the work, not this file.** What stays here is the events, the
# checkouts, the toolchains, the version derived from the event, and the
# publishing. What builds, tests and packages lives in `scripts/`, so a person
# can reproduce a whole publication without reading this YAML.
#
# Not signed yet. Windows shows the SmartScreen warning, and the publication's
# body says so instead of hiding it. Signing with SignPath arrives once the
# request is approved: see `docs/07-futuro.md`.
name: Release

# **Both automatic triggers are needed, and this is not belt and braces.** A
# tag pushed with `git push --tags` arrives through `push`. A release created
# from GitHub's web UI, which creates the tag internally, produced NO `push` run
# here: the `v0.1.0` tag from 2026-08-06 existed, the file was already in its
# commit with `push: tags`, and the Actions API recorded nothing. That path
# comes in through `release: published`.
#
# Mind the consequence: for a release made from the web, the file that runs is
# the one in the COMMIT THE TAG POINTS AT. Tagging a commit older than this
# paragraph triggers nothing again, and there is no fix for that on `main`: the
# tag has to come from a commit that already carries this `on:`. The same goes
# for the scripts it calls, because the tag's commit brings its YAML and its
# scripts, consistent with each other.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      engine:
        description: "Engine tag to package, skipping the pin. Empty uses engine.pin"
        default: ""

# Pushing the tag AND creating the release on that same tag are two events for
# one publication. Without this the same thing would build twice, twenty minutes
# each time; with it, the second cancels the first and publishes.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  installer:
    name: kanpachi-setup.exe
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # **The engine lives in another repository, publishes BY TAG, and is
      # DOWNLOADED here.** Until 2026-08-19 this job built it, and that had two
      # defects the download kills at once: the binary that passed the engine's
      # customs (clippy, tests, the listener sweep) was not the one that
      # shipped, because it was another build of the same ref, and that ref was
      # `main`, a moving pointer that rebuilds nothing. Today the published
      # binary IS the one that passed customs, the pin is content (tag + SHA256
      # in `engine.pin`), and this job spends seconds downloading instead of
      # twelve minutes of Rust.
      #
      # The 25-minute wait covers the real race: tagging the engine and tagging
      # Kanpachi one after the other, with the engine's customs still
      # publishing. Bounded, because an engine that is never going to publish
      # has to leave this release RED and named, not hanging.
      #
      # `inputs.engine` (workflow_dispatch only) skips the pin and names another
      # tag. There is no hash to demand there and the log shouts about it, and
      # the binary gives itself away anyway: it carries its build id sealed
      # inside.
      - name: Download the pinned engine
        shell: pwsh
        run: |
          $pin = @{}
          Get-Content engine.pin | Where-Object { $_ -match '^\S' -and $_ -notmatch '^#' } | ForEach-Object {
            $parts = $_ -split '\s+', 2; $pin[$parts[0]] = $parts[1].Trim()
          }
          $tag = if ('${{ inputs.engine }}') { '${{ inputs.engine }}' } else { $pin['tag'] }
          $url = "https://github.com/alvarogabrielgomez/kanpachi-engine/releases/download/$tag/kanpachi-engine.exe"
          New-Item -ItemType Directory -Force engine | Out-Null
          $deadline = (Get-Date).AddMinutes(25)
          while ($true) {
            try {
              Invoke-WebRequest -Uri $url -OutFile engine\kanpachi-engine.exe -MaximumRedirection 8
              break
            } catch {
              if ((Get-Date) -gt $deadline) { throw "engine $tag published no kanpachi-engine.exe within 25 minutes: $_" }
              Write-Host "engine $tag has no assets yet, retrying in 30s..."
              Start-Sleep -Seconds 30
            }
          }
          $sha = (Get-FileHash engine\kanpachi-engine.exe -Algorithm SHA256).Hash.ToLower()
          if ('${{ inputs.engine }}') {
            Write-Host "::warning::engine $tag came from inputs.engine, NOT verified against engine.pin. SHA256 $sha"
          } elseif ($sha -ne $pin['sha256-windows'].ToLower()) {
            throw "the kanpachi-engine.exe from $tag is not the pinned one.`n  pin:        $($pin['sha256-windows'])`n  downloaded: $sha"
          } else {
            Write-Host "engine $tag verified: $sha"
          }
          echo "ENGINE_TAG=$tag" >> $env:GITHUB_ENV

      # The version comes out of the EVENT, so it is derived here and not in a
      # script: it is the only thing in this job that is context rather than
      # work.
      - name: Resolve the version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # `v0.1.0` -> `0.1.0`.
          #
          # - push of a local tag: arrives through GITHUB_REF_TYPE=tag
          # - release published from the web: github.event.release.tag_name
          # - workflow_dispatch: no tag, it goes out as 0.0.0 for tests
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          fi

          if [ -z "$TAG" ]; then
            VER="0.0.0"
          else
            VER="${TAG#v}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          # Inno's VersionInfoVersion has to be numeric, so a `0.2.0-rc1` loses
          # its suffix ONLY for that field. The publication's name keeps the
          # whole tag.
          echo "VERSION_NUM=${VER%%-*}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned by SHA and not by tag, for the same reason as in ci.yml: it runs
      # in the same job as the checkout, so a moved tag would execute new code
      # over this source without anything in the diff saying so.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # `/third_party/` is in .gitignore for its size (~80 MB), so the checkout
      # arrives WITHOUT the engine's DLLs and packaging would stop. The script
      # downloads them from the official release, and why it downloads all SEVEN
      # instead of the three that get packaged is in its header: with the whole
      # directory, the supply guard in `internal/arch` verifies the entire
      # manifest instead of skipping it over a missing directory.
      - name: Fetch the engine's third-party binaries
        shell: pwsh
        run: .\scripts\fetch-third-party.ps1

      # **What gets published goes through the tests that pass today**, no more
      # and no less: `core`, the guards in `internal/arch`, and the UI with
      # `analyze` and `test`. Which ones and why, in the script's header.
      - name: Verify the release-windows surface
        shell: pwsh
        run: .\scripts\verify.ps1 -Surface release-windows

      # Seals the version into the resources, stages the payload, runs Inno
      # Setup, builds the portable and writes SHA256SUMS-windows. The five steps
      # and their reasons live in the script's header, which is what makes a
      # whole publication reproducible by hand with one command.
      - name: Package the Windows client
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 `
            -Version "$env:VERSION" `
            -VersionNum "$env:VERSION_NUM" `
            -Engine "$env:GITHUB_WORKSPACE\engine\kanpachi-engine.exe" `
            -Repo "${{ github.repository }}" `
            -Output "$env:GITHUB_WORKSPACE\dist"

      # Both hashes come out of the manifest the script just wrote, and are not
      # computed again: two computations are two chances to publish a number
      # that does not belong to the file that was uploaded.
      - name: Read the checksums
        id: sums
        shell: pwsh
        run: |
          $sums = @{}
          foreach ($line in Get-Content "$env:GITHUB_WORKSPACE\dist\SHA256SUMS-windows") {
            $parts = $line -split '\s+', 2
            $sums[$parts[1].Trim()] = $parts[0]
          }
          "setup_sha=$($sums['kanpachi-setup.exe'])"       | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portable_sha=$($sums['kanpachi-portable.exe'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The stretch of the CHANGELOG that belongs to this version, for the
      # publication's body. No entry means no publication, and that is on
      # purpose: the reason is in the script's header.
      - name: Read the release notes
        id: notes
        shell: pwsh
        run: |
          $text = .\scripts\release-notes.ps1 -Version "$env:VERSION" | Out-String
          "notes<<KANPACHI_END" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $text.TrimEnd()      | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "KANPACHI_END"        | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish to the release
        if: github.ref_type == 'tag' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          # Explicit because the two entry points name the tag in different
          # places: `github.ref_name` on the push, `event.release.tag_name` on
          # the publication from the web.
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          # Without this, a publication created from the web would lose the
          # text somebody wrote by hand: `body` REPLACES. With `append_body`,
          # what follows is added to whatever was there, and on the tag path,
          # where there was nothing, it comes out the same as before.
          append_body: true
          # Publishing without the installer is the worst of both worlds: an
          # announced version nobody can install, and the download page's
          # permanent URL pointing at an empty publication.
          fail_on_unmatched_files: true
          files: |
            dist/kanpachi-setup.exe
            dist/kanpachi-portable.exe
            dist/SHA256SUMS-windows
          body: |
            ## What changed

            ${{ steps.notes.outputs.notes }}

            ## Windows 10 and 11, 64-bit

            **`kanpachi-setup.exe`** installs with one UAC prompt, and that is
            the only one in the life of the product. Neither booting the PC nor
            opening the app asks again.

            Windows shows the SmartScreen warning, because this is not signed
            yet: press "More info", then "Run anyway".

            ```
            SHA256  ${{ steps.sums.outputs.setup_sha }}
            ```

            **`kanpachi-portable.exe`** is the same product in one file, and it
            installs nothing: no service, no autostart, no ProgramData. It costs
            a UAC prompt per run, it does not start with Windows, and it forgets
            its identity between runs. Use it to try Kanpachi out; install it to
            play regularly.

            ```
            SHA256  ${{ steps.sums.outputs.portable_sha }}
            ```

            Engine `${{ env.ENGINE_TAG }}`, verified against `engine.pin`: the
            binary that passed the engine's customs is the one inside.

            ## Linux, amd64

            ```
            curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/kanpachi-amd64.deb
            sudo apt install ./kanpachi-amd64.deb
            ```

            No window. The client is the `kanpachi` command, with a wizard when
            you run it with no arguments. Built on Ubuntu 22.04, so it also runs
            on 24.04.

            It installs two systemd units: `kanpachid`, the daemon, and
            `kanpachi-quarantine`, which loads before the network comes up and
            keeps the game ports closed from the internet **with Kanpachi
            switched off**.

            `sudo kanpachi doctor` checks the machine and writes nothing;
            `--fix` repairs what belongs to Kanpachi. `sudo kanpachi upgrade`
            brings the next version. Checksums in `SHA256SUMS-linux`.

            ## Container, amd64

            `ghcr.io/${{ github.repository }}:${{ env.VERSION }}` and `:latest`.
            Partial tags are not published, so pin the whole number or follow
            `latest`.

            Copy a compose file from
            [`docker/templates/`](https://github.com/${{ github.repository }}/tree/main/docker/templates)
            and `docker compose up -d`. The invite code is printed on every
            start, so `docker logs` answers "what is the code". Rebuild the
            container and the same code comes back, because the room lives in a
            volume: lose that volume and the code is gone for good.

            It needs `cap_add: [NET_ADMIN]` and `/dev/net/tun`, which a
            container cannot grant itself. Kanpachi Protection does not reach in
            here, because what makes it a promise is a systemd unit loading at
            boot.

            [Run a game server with Docker](https://github.com/${{ github.repository }}/blob/main/docs/public/run-a-game-server-docker.md)

            ## Rendezvous node, Linux

            `kanpseed-linux-amd64`, `kanpseed-linux-arm64` and `index.html` come
            out of the same tag as the client, so both halves carry the same
            number.

            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/seed/install.sh | sudo sh
            ```

            On a seed that is already installed, `sudo kanpseed upgrade`.
            Checksums in `SHA256SUMS-seed-linux`.

      # With nothing to publish to, the manual run leaves the installer as an
      # artifact. That is what makes it possible to test this whole workflow
      # without creating a tag or a publication somebody has to delete later.
      - name: Keep the installer as an artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kanpachi-setup
          path: |
            dist/kanpachi-setup.exe
            dist/kanpachi-portable.exe
            dist/SHA256SUMS-windows

  # The Linux client, which is a THIRD job writing into the same release.
  #
  # # Why a separate job and not a step of the one above
  #
  # Because each artifact is compiled on its own system, and that is not a
  # preference. The engine on Linux pulls in vendored dbus, zstd-sys and kcp-sys
  # with bindgen, so cross-compiling from Windows would mean three C toolchains
  # with a Linux linker and sysroot wired up by hand. Same rule the Windows job
  # already states for the other direction.
  #
  # # Why ubuntu-22.04 and not ubuntu-latest
  #
  # The glibc floor decides where the package runs, and only the ENGINE has one:
  # the two Go binaries are built with CGO off. Built on 24.04 it demands
  # GLIBC_2.39 and does NOT start on 22.04, which is the release most often
  # found on a VPS. Built here it demands 2.35 or less and runs on both. This is
  # a release decision, so it lives in the workflow and not in the code — and
  # the check that ENFORCES it lives in `build-deb.sh --strict`, which is the
  # same check a person gets as a warning without the flag.
  #
  # It does not wait for the Windows job and the Windows job does not wait for
  # it. That is the same trade already accepted for the seed: a window exists
  # where the release is published with some payloads missing, it closes by
  # itself, and the alternative was twenty minutes of Windows delaying a Linux
  # payload that was ready.
  linux-package:
    name: kanpachi-amd64.deb
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Same three entry points as the other two jobs. With no tag the
          # version is 0.0.0 and nothing is published: a package that announced
          # itself as a real version would make `kanpachi upgrade` on somebody's
          # server compare against something nobody released.
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "VERSION=${TAG:-0.0.0}" >> "$GITHUB_ENV"
          echo "release_target=$TAG" >> "$GITHUB_OUTPUT"

      # The Linux half of the same download the Windows job does: the binary
      # the engine's customs published, verified against `engine.pin`. The whole
      # reason is in the matching step above. The bounded wait is the same: 25
      # minutes, then red and named, never hanging.
      - name: Download the pinned engine
        run: |
          tag="${{ inputs.engine }}"
          if [ -z "$tag" ]; then
            tag=$(awk '$1 == "tag" { print $2 }' engine.pin)
          fi
          url="https://github.com/alvarogabrielgomez/kanpachi-engine/releases/download/$tag/kanpachi-engine"
          mkdir -p engine
          deadline=$(( $(date +%s) + 25*60 ))
          until curl -fsSL -o engine/kanpachi-engine "$url"; do
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "engine $tag published no kanpachi-engine within 25 minutes" >&2
              exit 1
            fi
            echo "engine $tag has no assets yet, retrying in 30s..."
            sleep 30
          done
          chmod +x engine/kanpachi-engine
          sha=$(sha256sum engine/kanpachi-engine | awk '{print $1}')
          if [ -n "${{ inputs.engine }}" ]; then
            echo "::warning::engine $tag came from inputs.engine, NOT verified against engine.pin. SHA256 $sha"
          else
            want=$(awk '$1 == "sha256-linux" { print $2 }' engine.pin)
            if [ "$sha" != "$want" ]; then
              echo "the kanpachi-engine from $tag is not the pinned one." >&2
              echo "  pin:        $want" >&2
              echo "  downloaded: $sha" >&2
              exit 1
            fi
            echo "engine $tag verified: $sha"
          fi

      # The same tests the Windows job runs before packaging, and for the same
      # reason: what gets published passes the tests that pass today.
      - name: Verify the release-linux surface
        shell: pwsh
        run: ./scripts/verify.ps1 -Surface release-linux

      # `--strict` turns the glibc floor from a warning into a stop, and writes
      # SHA256SUMS-linux beside the package. `SHA256SUMS-linux` is the CLIENT's
      # and the seed's is `SHA256SUMS-seed-linux`: three workflows write into one
      # release, so a shared name means the last one to upload overwrites the
      # others and leaves `kanpachi upgrade` verifying a package that is not
      # listed.
      - name: Build the .deb
        run: |
          scripts/build-deb.sh \
            --strict \
            --version "$VERSION" \
            --engine engine/kanpachi-engine \
            --out dist

      - name: Publish to the release
        if: steps.version.outputs.release_target != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_target }}
          # No body: the release text is written by the job above, which is the
          # one that knows the installer's SHA. Two jobs writing the same body
          # would give a different order on every publication.
          fail_on_unmatched_files: true
          files: |
            dist/kanpachi-amd64.deb
            dist/SHA256SUMS-linux

      - name: Keep the .deb as an artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kanpachi-deb
          path: |
            dist/kanpachi-amd64.deb
            dist/SHA256SUMS-linux

  # ─────────────────────────────────────────────────────────────────────────────
  # The fourth publisher, and it goes WITHOUT `needs:` like the other three.
  #
  # Independence is the standing decision, written down in `release-seed.yml`: if
  # one fails, the release stays without that piece until somebody relaunches it,
  # and that is accepted because chaining them would cost exactly what makes them
  # separate.
  #
  # The consequence here is concrete and it shapes how the image is built: **the
  # `.deb` cannot be downloaded from the release**, because by the time this runs
  # it may not be there yet. Downloading it would bake the PREVIOUS version into
  # an image tagged with the new one, and it would pass green. So this job
  # downloads the engine and builds its own package, the same as its neighbour.
  image:
    name: ghcr.io/kanpachi
    runs-on: ubuntu-22.04
    permissions:
      # At JOB level and not at workflow level: the other three publish no
      # packages and have no business being able to.
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # The same three entry points as the other jobs.
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "VERSION=${TAG:-0.0.0}" >> "$GITHUB_ENV"
          echo "release_target=$TAG" >> "$GITHUB_OUTPUT"
          # Without the leading `v`, which is how an image tag is written. The
          # default is applied BEFORE stripping it: with no tag, `${TAG#v}` gives
          # the empty string and `docker build --tag name:` is not a tag.
          raw="${TAG:-0.0.0}"
          echo "IMAGE_TAG=${raw#v}" >> "$GITHUB_ENV"

      # Identical to the package job's: the binary the engine's customs
      # published, verified against `engine.pin`, with the same 25-minute
      # bounded wait.
      - name: Download the pinned engine
        run: |
          tag="${{ inputs.engine }}"
          if [ -z "$tag" ]; then
            tag=$(awk '$1 == "tag" { print $2 }' engine.pin)
          fi
          url="https://github.com/alvarogabrielgomez/kanpachi-engine/releases/download/$tag/kanpachi-engine"
          mkdir -p engine
          deadline=$(( $(date +%s) + 25*60 ))
          until curl -fsSL -o engine/kanpachi-engine "$url"; do
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "engine $tag published no kanpachi-engine within 25 minutes" >&2
              exit 1
            fi
            echo "engine $tag has no assets yet, retrying in 30s..."
            sleep 30
          done
          chmod +x engine/kanpachi-engine
          sha=$(sha256sum engine/kanpachi-engine | awk '{print $1}')
          if [ -n "${{ inputs.engine }}" ]; then
            echo "::warning::engine $tag came from inputs.engine, NOT verified against engine.pin. SHA256 $sha"
          else
            want=$(awk '$1 == "sha256-linux" { print $2 }' engine.pin)
            if [ "$sha" != "$want" ]; then
              echo "the kanpachi-engine from $tag is not the pinned one." >&2
              echo "  pin:        $want" >&2
              echo "  downloaded: $sha" >&2
              exit 1
            fi
            echo "engine $tag verified: $sha"
          fi

      - name: Verify the release-linux surface
        shell: pwsh
        run: ./scripts/verify.ps1 -Surface release-linux

      - name: Resolve the image name
        id: image
        run: |
          # Lowercased, because an image name admits no capitals and a
          # repository owner can have them.
          repo=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$repo" >> "$GITHUB_OUTPUT"

      # The script builds the package, leaves it beside the Dockerfile, builds
      # the image, and checks which version ended up inside by asking the CLI in
      # the image.
      - name: Build the image
        run: |
          tags="--tag ${{ steps.image.outputs.name }}:$IMAGE_TAG"
          if [ -n "${{ steps.version.outputs.release_target }}" ]; then
            tags="$tags --tag ${{ steps.image.outputs.name }}:latest"
          fi
          # shellcheck disable=SC2086
          scripts/build-image.sh \
            --version "$IMAGE_TAG" \
            --engine engine/kanpachi-engine \
            $tags

      # The login goes AFTER the build on purpose: a broken build has no
      # business having asked for credentials.
      - name: Log in to ghcr
        if: steps.version.outputs.release_target != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: steps.version.outputs.release_target != ''
        run: |
          docker push "${{ steps.image.outputs.name }}:$IMAGE_TAG"
          docker push "${{ steps.image.outputs.name }}:latest"
