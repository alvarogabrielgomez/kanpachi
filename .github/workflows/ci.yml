# Los chequeos completos, A MANO.
#
# **No corren en cada push ni en cada pull request, y es deliberado.** Lo que se
# publica sale de un tag, y cada workflow de publicacion corre los tests que
# gobiernan lo que publica: `release.yml` los de `core` y los guardianes de
# `internal/arch`, `release-seed.yml` los de `core` y `registry`. Un job por push
# repetiria eso mismo sobre commits que nadie va a publicar.
#
# Esto se lanza a mano desde la pestana Actions, o lo llama otro workflow.
#
# **La receta no esta aca: esta en `scripts/verify.ps1`.** Cada job la llama con
# su `-Surface`, y esa es la unica copia. Cuando la lista de paquetes vivia
# dentro de este fichero Y dentro del script, las dos derivaron: comprobar algo
# antes de empujar significaba teclear a mano una lista de dieciseis entradas, y
# lo que se teclea distinto se comprueba distinto. Que paquete entra a cada
# comprobacion se decide en el script y en ningun otro sitio.
#
# La interfaz se prueba contra el repositorio REAL del pipe sobre un transporte
# de bytes en memoria. No hay repositorio alternativo ni estado plantado en el
# cubit: saludo, codec, metodos y mapeo de respuestas cruzan la misma frontera
# que en produccion, sin necesitar Windows ni un daemon levantado.
name: CI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Corre en Linux a propósito, y no es una economía de minutos.
  # docs/CLAUDE.md define la métrica de la arquitectura así: "los tests de core
  # corren sin admin, sin red y sin Windows". Ejecutarlos en Ubuntu es lo que
  # convierte esa frase en algo comprobable. Si un día core deja de compilar
  # acá, la arquitectura se rompió y este job es quien lo dice.
  #
  # `pwsh` viene preinstalado en los runners de Ubuntu, así que el mismo script
  # corre en los tres sistemas. Hay que pedirlo explícito: el shell por omisión
  # en Linux es bash, y un `.ps1` no arranca solo.
  core:
    name: core en Linux, sin privilegios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Compila TODO en Linux, corre vet, los guardianes de arquitectura, core,
      # lo portable de daemon, el registro y gofmt. Qué entra en cada paso, y
      # por qué la lista es explícita en vez de `./...`, está en la cabecera del
      # script.
      - name: Los chequeos de esta superficie
        shell: pwsh
        run: ./scripts/verify.ps1 -Surface ci-linux

  # El daemon se compila donde va a correr, y desde que hay dos sistemas eso son
  # dos jobs: este y el de `core`, que ya compila y prueba en Linux.
  #
  # Este además EJECUTA los tests, que es nuevo. El comentario de antes decía que
  # no se ejecutaban "porque el paquete no existe", y hace tiempo que existe. Lo
  # que lo vuelve obligatorio es que el canal local se partió por sistema: las
  # invariantes del descriptor de seguridad y del prefijo protegido son
  # constantes de Windows, así que su guardián solo dice algo donde compilan.
  daemon:
    name: daemon en Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Sin -ldflags="-s -w" y sin -race, las dos por su razón, escritas en el
      # script: la primera son los falsos positivos de Defender sobre binarios
      # Go, la segunda es que -race en Windows exige una cadena de C y el mismo
      # código ya corre con -race en el job de arriba.
      - name: Los chequeos de esta superficie
        shell: pwsh
        run: .\scripts\verify.ps1 -Surface ci-windows

  # La UI corre en UBUNTU, con el cliente siendo solo de Windows, y no es un
  # descuido.
  #
  # `flutter test` corre sobre la VM de Dart, y los guardianes que de verdad
  # importan acá leen fuente de GO del disco para comprobar que los dos lados del
  # cable dicen lo mismo. Ninguna de las dos cosas depende del sistema operativo.
  # Compilar el bundle de Windows es otro trabajo y no es el que falta hoy: lo
  # que falta es que `message_lockstep_test.dart` deje de correr solo cuando
  # alguien se acuerda. El día que un enum del daemon crezca sin su caso en Dart,
  # esto es lo que lo dice.
  ui:
    name: la UI de Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fijada por SHA y no por tag. Corre en el mismo trabajo que el checkout,
      # así que un tag movido ejecutaría código nuevo sobre el fuente de este
      # repo sin que nada en el diff lo diga. El comentario lleva la versión
      # legible porque un SHA suelto no se puede leer.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # A dedo y no con flutter-version-file: `ui/pubspec.yaml` declara el
          # SDK de Dart (`sdk: ^3.12.1`) y NO tiene clave `flutter:`, así que no
          # hay nada que ese fichero pueda leer.
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      # Sin `working-directory`: el script entra a `ui/` por su cuenta, que es
      # lo que le permite correrse igual desde la raíz en una máquina cualquiera.
      - name: Los chequeos de esta superficie
        shell: pwsh
        run: ./scripts/verify.ps1 -Surface ci-ui
