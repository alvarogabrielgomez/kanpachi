name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Corre en Linux a propósito, y no es una economía de minutos.
  # docs/CLAUDE.md define la métrica de la arquitectura así: "los tests de core
  # corren sin admin, sin red y sin Windows". Ejecutarlos en Ubuntu es lo que
  # convierte esa frase en algo comprobable. Si un día core deja de compilar
  # acá, la arquitectura se rompió y este job es quien lo dice.
  core:
    name: core en Linux, sin privilegios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./core/... ./internal/... ./daemon/service/... ./daemon/transport/protocol/... ./daemon/transport/wire/... ./daemon/transport/control/... ./daemon/transport/pipe/... ./daemon/adapter/sinimplementar/... ./daemon/adapter/safewrite/... ./daemon/adapter/state/... ./daemon/adapter/catalog/... ./daemon/adapter/canary/... ./registry/...

      - name: Test de pureza de imports
        # Se ejecuta aparte y primero para que su fallo sea inconfundible en el
        # log. Es una violación de arquitectura, no un test más que se rompió.
        run: go test -v -count=1 ./internal/arch/...

      - name: Tests de core
        run: go test -race -count=1 ./core/...

      # Lo de daemon/ que NO es de Windows va en el job de Linux, por el mismo
      # motivo que core. Son cinco cosas y cada una por su razón:
      #
      #   service/            el supervisor solo habla con puertos de core
      #   transport/protocol/ el protocolo se define aparte de su transporte
      #   transport/wire/     enmarcado de mensajes, io.Reader e io.Writer
      #   transport/control/  el canal de la sala: sockets y bytes, sin Windows
      #   transport/pipe/     TODO menos crear el pipe: plazas, plazos y cierre
      #                       son lógica sobre net.Listener, y la lógica que solo
      #                       corre en la máquina donde se programa no tiene CI
      #   adapter/sinimplementar/  que los provisionales fallen en todo es lo
      #                       que hace la cuarentena verificable desde dentro
      #   adapter/{safewrite,state,catalog}/  son rutas y bytes, no API de Windows
      #   adapter/probe/      marca un puerto TCP. Es `net` puro, y el caso que
      #                       más importa, el rechazo de Winsock, se prueba acá
      #                       con su número escrito a mano
      #   adapter/canary/     el oyente que existe para ser bloqueado. Abre
      #                       sockets de verdad sobre loopback y no toca ninguna
      #                       API de Windows. El `/...` incluye a `opener/`, que
      #                       es el traductor a la lengua de core y vive en su
      #                       propio paquete justo para que el de arriba conserve
      #                       su grafo de imports libre de `core`
      #   adapter/firewall + wfp/  la capa pura de la compuerta, y el orden de las
      #                       dos capas, que es una regla probada. Entraron el día
      #                       que `wfp.Measurement` se mudó a un archivo portable:
      #                       mientras vivió en `gate_windows.go`, el paquete
      #                       compuesto NO COMPILABA en Linux y sus tests puros no
      #                       llegaban a ejecutarse nunca
      #
      # Correrlos en Ubuntu es lo que convierte esas frases en algo comprobable.
      # Con -race porque el supervisor y el canal de la sala son los dos
      # paquetes del proyecto con goroutines de larga vida.
      #
      # La lista es explícita a propósito: el motor, el firewall por COM y
      # netcfg son solo Windows y sus paquetes no compilan acá.
      - name: Tests de lo portable de daemon
        run: >-
          go test -race -count=1
          ./daemon/service/...
          ./daemon/transport/protocol/...
          ./daemon/transport/wire/...
          ./daemon/transport/control/...
          ./daemon/transport/pipe/...
          ./daemon/adapter/sinimplementar/...
          ./daemon/adapter/safewrite/...
          ./daemon/adapter/state/...
          ./daemon/adapter/catalog/...
          ./daemon/adapter/probe/...
          ./daemon/adapter/canary/...
          ./daemon/adapter/firewall
          ./daemon/adapter/firewall/wfp/...

      # El registro es el seed, o sea Linux por definición. Va en este job y no
      # en el de Windows. Con -race porque atiende peticiones concurrentes
      # contra un mapa compartido, que es justo donde una carrera se esconde.
      - name: Tests del registro del seed
        run: go test -race -count=1 ./registry/...

      - name: gofmt
        run: |
          sin_formato=$(gofmt -l ./core ./internal ./daemon)
          if [ -n "$sin_formato" ]; then
            echo "Estos archivos no están formateados:"
            echo "$sin_formato"
            exit 1
          fi

  # El daemon es solo Windows, así que se compila donde va a correr. No se
  # ejecutan sus tests todavía porque el paquete no existe; el job queda
  # declarado para que exista el día que se agregue y nadie tenga que
  # acordarse.
  daemon:
    name: daemon en Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Sin -ldflags="-s -w". Quitar la tabla de símbolos dispara falsos
      # positivos del modelo de Defender sobre binarios Go, y este daemon crea
      # adaptadores de red y toca el firewall, o sea es candidato de manual.
      # Ver docs/07-futuro.md.
      - name: Compilar todo
        run: go build ./...

  # La UI corre en UBUNTU, con el cliente siendo solo de Windows, y no es un
  # descuido.
  #
  # `flutter test` corre sobre la VM de Dart, y los guardianes que de verdad
  # importan acá leen fuente de GO del disco para comprobar que los dos lados del
  # cable dicen lo mismo. Ninguna de las dos cosas depende del sistema operativo.
  # Compilar el bundle de Windows es otro trabajo y no es el que falta hoy: lo
  # que falta es que `message_lockstep_test.dart` deje de correr solo cuando
  # alguien se acuerda. El día que un enum del daemon crezca sin su caso en Dart,
  # esto es lo que lo dice.
  ui:
    name: la UI de Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      # Fijada por SHA y no por tag. Corre en el mismo trabajo que el checkout,
      # así que un tag movido ejecutaría código nuevo sobre el fuente de este
      # repo sin que nada en el diff lo diga. El comentario lleva la versión
      # legible porque un SHA suelto no se puede leer.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # A dedo y no con flutter-version-file: `ui/pubspec.yaml` declara el
          # SDK de Dart (`sdk: ^3.12.1`) y NO tiene clave `flutter:`, así que no
          # hay nada que ese fichero pueda leer.
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test

      # --fatal-infos y no --fatal-warnings: hoy pasa limpio, así que el listón
      # se pone donde está el proyecto y no un escalón por debajo.
      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - run: flutter test
