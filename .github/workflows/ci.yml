# The full checks, BY HAND.
#
# **They do not run on every push or every pull request, and that is
# deliberate.** What gets published comes from a tag, and each publishing
# workflow runs the tests that govern what it publishes: `release.yml` runs
# `core` and the guards in `internal/arch`, `release-seed.yml` runs `core` and
# `registry`. A job per push would repeat that same work over commits nobody is
# going to publish.
#
# This is launched by hand from the Actions tab, or called by another workflow.
#
# **The recipe is not here: it is in `scripts/verify.ps1`.** Each job calls it
# with its own `-Surface`, and that is the only copy. Back when the package list
# lived inside this file AND inside the script, the two drifted: checking
# something before pushing meant typing a sixteen-entry list by hand, and what
# gets typed differently gets checked differently. Which package enters which
# check is decided in the script and nowhere else.
#
# The interface is tested against the REAL pipe repository over an in-memory
# byte transport. There is no alternative repository and no state planted in the
# cubit: handshake, codec, methods and response mapping cross the same boundary
# they cross in production, without needing Windows or a running daemon.
name: CI

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Runs on Linux on purpose, and not to save minutes.
  # docs/CLAUDE.md defines the architecture's metric like this: "core's tests run
  # without admin, without network and without Windows". Running them on Ubuntu
  # is what turns that sentence into something checkable. The day core stops
  # compiling here, the architecture broke and this job is what says so.
  #
  # `pwsh` ships preinstalled on the Ubuntu runners, so the same script runs on
  # all three systems. It has to be asked for explicitly: the default shell on
  # Linux is bash, and a `.ps1` does not start on its own.
  core:
    name: core on Linux, unprivileged
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Builds EVERYTHING on Linux, runs vet, the architecture guards, core, the
      # portable half of daemon, the registry and gofmt. What enters each step,
      # and why the list is explicit instead of `./...`, is in the script's
      # header.
      - name: Verify the ci-linux surface
        shell: pwsh
        run: ./scripts/verify.ps1 -Surface ci-linux

  # The daemon is compiled where it is going to run, and since there are two
  # systems that means two jobs: this one and `core`, which already builds and
  # tests on Linux.
  #
  # This one also RUNS the tests, which is new. The comment that used to be here
  # said they were not run "because the package does not exist", and it has
  # existed for a while. What makes it mandatory is that the local channel split
  # per system: the invariants of the security descriptor and of the protected
  # prefix are Windows constants, so their guard only says something where they
  # compile.
  daemon:
    name: daemon on Windows
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Without -ldflags="-s -w" and without -race, each for its own reason,
      # both written down in the script: the first one is Defender's false
      # positives on Go binaries, the second is that -race on Windows demands a
      # C toolchain and the same code already runs with -race in the job above.
      - name: Verify the ci-windows surface
        shell: pwsh
        run: .\scripts\verify.ps1 -Surface ci-windows

  # The UI runs on UBUNTU, with the client being Windows-only, and that is not
  # an oversight.
  #
  # `flutter test` runs on the Dart VM, and the guards that actually matter here
  # read GO source off the disk to check that both sides of the wire say the
  # same thing. Neither of those depends on the operating system. Building the
  # Windows bundle is another job and not the one missing today: what is missing
  # is that `message_lockstep_test.dart` stops running only when somebody
  # remembers. The day an enum in the daemon grows without its case in Dart,
  # this is what says so.
  ui:
    name: the Flutter UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Pinned by SHA and not by tag. It runs in the same job as the checkout,
      # so a moved tag would execute new code over this repository's source
      # without anything in the diff saying so. The comment carries the readable
      # version because a bare SHA cannot be read.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # By hand and not with flutter-version-file: `ui/pubspec.yaml`
          # declares the Dart SDK (`sdk: ^3.12.1`) and has NO `flutter:` key, so
          # there is nothing for that file to read.
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      # No `working-directory`: the script enters `ui/` on its own, which is
      # what lets it run the same way from the root on any machine.
      - name: Verify the ci-ui surface
        shell: pwsh
        run: ./scripts/verify.ps1 -Surface ci-ui
